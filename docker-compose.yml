services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      STORAGE_PATH: /data/storage
    volumes: ["./storage:/data/storage"]
    ports: ["8000:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    environment: { VITE_BACKEND: "http://backend:8000" }
    ports: ["5173:5173"]
    depends_on: [backend]
